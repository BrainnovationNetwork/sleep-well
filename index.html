:root{
  --navy:#1B365D; --deep:#102443; --abyss:#0B1A33;
  --blue:#407EC9; --sky:#8BD3E6; --teal:#6DCDB8; --gold:#F1B434; --pink:#E06287;
  --ink:#fff; --ink2:rgba(255,255,255,.74); --ink3:rgba(255,255,255,.5);
  --glass:#24426f; --glass2:#2d4f82; --edge:transparent;
  --r:4px; --acc-rgb:109,205,184; --ease:cubic-bezier(.22,.8,.24,1); --mood:0;
  --f:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--abyss);color:var(--ink);font-family:var(--f);font-weight:300;font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow:hidden}
em,i{font-style:normal}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--sky);outline-offset:3px}
#app{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr auto;isolation:isolate;
  background:linear-gradient(168deg,#1d3d6b 0%,var(--navy) 34%,var(--deep) 70%,var(--abyss) 100%)}
#amb{position:absolute;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
.glow{position:absolute;z-index:-2;pointer-events:none;border-radius:50%;filter:blur(70px);transition:opacity 1.6s ease}
.glow.a{width:62vmax;height:62vmax;left:-22vmax;bottom:-30vmax;background:radial-gradient(closest-side,rgba(var(--acc-rgb),.36),transparent);opacity:calc(1 - var(--mood)*.8)}
.glow.b{width:52vmax;height:52vmax;right:-20vmax;top:-26vmax;background:radial-gradient(closest-side,rgba(64,126,201,.5),transparent);opacity:calc(1 - var(--mood)*.5)}
.glow.c{width:70vmax;height:70vmax;right:-28vmax;bottom:-36vmax;background:radial-gradient(closest-side,rgba(224,98,135,.42),rgba(241,180,52,.12) 60%,transparent);opacity:calc(var(--mood)*.95)}

/* top bar */
.bar{display:flex;align-items:center;gap:14px;padding:14px clamp(16px,4vw,36px) 6px;min-height:60px}
.bar .home{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--glass);border:1px solid var(--edge);transition:transform .25s var(--ease),background .25s}
.bar .home:hover{background:var(--glass2)} .bar .home:active{transform:scale(.92)}
.bar .home svg{width:24px;height:24px}
.bar .where{flex:1;min-width:0;line-height:1.2}
.bar .where b{display:block;font-weight:500;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .where span{font-size:13px;color:var(--ink3)}
.bar .aud,.bar .src{height:44px;padding:0 14px;border-radius:4px;font-size:14px;font-weight:400;color:var(--ink2);background:var(--glass);border:1px solid var(--edge)}
.bar .aud[hidden]{display:none}
.caps{display:flex;gap:5px;padding:4px clamp(16px,4vw,36px) 0}
.caps i{flex:1;height:5px;border-radius:5px;background:rgba(255,255,255,.13);overflow:hidden;position:relative}
.caps i::after{content:"";position:absolute;inset:0;border-radius:5px;background:linear-gradient(90deg,var(--sky),var(--teal));transform:scaleX(0);transform-origin:left;transition:transform .6s var(--ease)}
.caps i.on::after{transform:scaleX(1)}
.head{display:block}
body.is-home .bar .where,body.is-home .caps,body.is-home .nav,body.is-home .bar .home,body.is-home .bar .src{display:none}
body.is-home .bar{justify-content:space-between}
body:not(.is-home) .bar .logo{display:none}

/* stage */
#stage{overflow-y:auto;overflow-x:hidden;position:relative;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.2) transparent}
.scr{max-width:1060px;margin:0 auto;padding:clamp(18px,4vh,44px) clamp(18px,5vw,44px) 40px;min-height:100%;display:flex;flex-direction:column;justify-content:center}
.scr,.scr.top{justify-content:safe center}
.scr.split{display:grid;grid-template-columns:1fr;gap:26px;align-content:safe center}
@media(min-width:880px){.scr.split{grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:56px;align-items:center}.scr.split.flip>.art{order:-1}}
.scr.out{animation:scrOut .26s ease forwards}
@keyframes scrOut{to{opacity:0;transform:translateX(-22px)}}
.scr.outb{animation:scrOutB .26s ease forwards}
@keyframes scrOutB{to{opacity:0;transform:translateX(22px)}}
.rise{opacity:0;transform:translateY(16px)}
.rise.in{opacity:1;transform:none;transition:opacity .7s ease,transform .8s var(--ease)}
[data-beat]{display:none}
[data-beat].shown{display:block;animation:beat .8s var(--ease) both}
[data-beat].shown.flex{display:flex}
@keyframes beat{from{opacity:0;transform:translateY(14px)}}

h1,h2,h3{font-weight:500;letter-spacing:-.018em;line-height:1.08;text-wrap:balance}
h1{font-size:clamp(34px,6.4vw,62px)}
h2{font-size:clamp(28px,4.6vw,44px)}
h3{font-size:clamp(20px,2.6vw,25px);letter-spacing:-.01em;line-height:1.2}
p{max-width:36em;text-wrap:pretty}
.lead{font-size:clamp(19px,2.3vw,23px);line-height:1.42;color:var(--ink);font-weight:300}
.txt>*+*{margin-top:.85em} .txt>h2+*,.txt>h1+*{margin-top:1em}
.soft{color:var(--ink2)} .dim{color:var(--ink3);font-size:14.5px}
.say{font-size:clamp(21px,3vw,30px);line-height:1.28;font-weight:400;letter-spacing:-.01em;max-width:24em}
.teal{color:var(--teal)} .sky{color:var(--sky)} .gold{color:var(--gold)} .pink{color:var(--pink)}
strong,b{font-weight:500}
.art{position:relative;display:grid;place-items:center;min-height:240px}
.art svg{width:100%;height:auto;max-height:56vh;overflow:visible}
.panel{background:var(--glass);border:1px solid var(--edge);border-radius:var(--r);padding:20px 22px;}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:9px}
.chips button{padding:11px 16px;border-radius:4px;background:var(--glass);border:1px solid var(--edge);font-size:16px;font-weight:350;line-height:1.25;text-align:left;transition:background .25s,border-color .25s,transform .3s var(--ease),color .25s}
.chips button:hover{background:var(--glass2)}
.chips button:active{transform:scale(.95)}
.chips button.on{background:linear-gradient(135deg,rgba(var(--acc-rgb),.34),rgba(139,211,230,.22));border-color:var(--teal);color:#fff;font-weight:450}
.chips.warm button.on{background:linear-gradient(135deg,rgba(241,180,52,.3),rgba(224,98,135,.24));border-color:var(--gold)}
.grp+.grp{margin-top:20px} .grp>h3{margin-bottom:10px;font-size:18px;font-weight:450}

/* tap to reveal */
.taps{display:grid;gap:10px}
.tap{display:block;width:100%;text-align:left;padding:16px 18px;border-radius:4px;background:var(--glass);border:1px solid var(--edge);transition:background .3s,border-color .3s,transform .3s var(--ease);position:relative}
.tap:active{transform:scale(.985)}
.tap .f{display:flex;align-items:center;gap:12px;font-weight:450;font-size:17.5px}

var ICON=[ /* x1,y1,x2,y2,colour,cut (index of the capsule that overlaps this one) */
  [-2,-65,-2,-283,'#407EC9'],[-2,-417,-2,-461,'#6DCDB8'],
  [52,-45,185,-178,'#F1B434',3],[215,-205,270,-260,'#8BD3E6'],
  [75,2,295,2,'#6DCDB8'],[378,2,482,2,'#E06287'],
  [52,50,160,155,'#FFFFFF',7],[200,195,288,283,'#8BD3E6'],
  [-2,65,-2,197,'#E06287'],[-298,2,-175,2,'#F1B434'],[-55,-43,-177,-165,'#8BD3E6']];
var iconN=0;
function burstSVG(n,state,cls,anim){
  var id='ic'+(++iconN),defs='',out='';
  ICON.forEach(function(c,i){
    var ln=function(st,w,ex){return '<line x1="'+c[0]+'" y1="'+c[1]+'" x2="'+c[2]+'" y2="'+c[3]+'" stroke="'+st+'" stroke-width="'+w+'" stroke-linecap="round"'+(ex||'')+'/>'};
    var m='';
    if(c[5]!=null){var o=ICON[c[5]];defs+='<mask id="'+id+i+'" maskUnits="userSpaceOnUse" x="-400" y="-520" width="960" height="900"><rect x="-400" y="-520" width="960" height="900" fill="#fff"/><line x1="'+o[0]+'" y1="'+o[1]+'" x2="'+o[2]+'" y2="'+o[3]+'" stroke="#000" stroke-width="96" stroke-linecap="round"/></mask>';m=' mask="url(#'+id+i+')"'}
    if(anim)out+='<g'+m+'>'+ln('rgba(255,255,255,.13)',64)+ln(c[4],64,' class="hf" pathLength="1" style="animation-delay:'+(.3+i*.17).toFixed(2)+'s"')+'</g>';
    else out+='<g'+m+'>'+ln(c[4],64)+'</g>';
  });
  return '<svg viewBox="-340 -500 860 830" class="'+(cls||'')+'" role="img" aria-label="Brainnovation spark"><defs>'+defs+'</defs>'+out+'</svg>';
}
function heroBurst(){return burstSVG(0,null,'',true)}
/* Progress: 7 light beams, 1 per part, each rising and lighting when its part is complete. */
var BEAM=[['#407EC9','#8BD3E6'],['#6DCDB8','#8BD3E6'],['#F1B434','#f8d683'],['#E06287','#f2a3b7'],['#8BD3E6','#d9f1f8'],['#6DCDB8','#bfeadf'],['#F1B434','#E06287']];
function gStart(wi){var a=0;for(var j=0;j<wi;j++)a+=(CFG.weeks[j].days||7);return a}
function gOf(i){var a=0;for(var j=0;j<CFG.weeks.length;j++){a+=(CFG.weeks[j].days||7);if(i<a)return j}return CFG.weeks.length-1}
function gLabel(wi){return (CFG.groupWord||'Week')+' '+(wi+1)}
function planned(){return CFG.allTitles?CFG.allTitles.slice(mods.length):[]}
function beamsHTML(hold){
  var n=0;mods.forEach(function(m){if(S.done[m.id])n++});
  var total=mods.length+planned().length;
  var one=function(i){var m=mods[i],c=BEAM[i%BEAM.length],on=m&&S.done[m.id]&&i!==hold;
    return '<div class="beam'+(on?' on':'')+'" data-i="'+i+'" style="--h:'+(CFG.weeks?(40+i*(60/(total-1))).toFixed(1):(46+i*9))+'%;--c1:'+c[0]+';--c2:'+c[1]+';--d:'+(i*(CFG.weeks?.04:.09)).toFixed(2)+'s"><i></i>'+(CFG.weeks?'':'<b>'+(CFG.named?CFG.unit+' ':'')+(i+1)+'</b>')+'</div>'};
  var lab=' role="img" aria-label="'+n+' of '+total+' '+CFG.countWord+' complete"';

  return '<div class="beams wk"'+lab+'>'+CFG.weeks.map(function(w,wi){var o='',a=gStart(wi),z=a+(w.days||7);for(var i=a;i<z&&i<total;i++)o+=one(i);
    return '<div class="bwk" style="flex:'+(w.days||7)+'"><div class="bwkb">'+o+'</div><b>'+esc(w.short||gLabel(wi))+'</b></div>'}).join('')+'</div>';
}
var fx;
function spark(target,opt){
  opt=opt||{}; if(!fx) return;
  var x,y;
  if(target&&target.getBoundingClientRect){var r=target.getBoundingClientRect();x=r.left+r.width/2;y=r.top+r.height/2}
  else if(target&&typeof target.x==='number'){x=target.x;y=target.y}
  else{x=innerWidth/2;y=innerHeight/2}
  var big=opt.big, n=opt.n||(big?16:8), dist=opt.dist||(big?Math.min(innerWidth,innerHeight)*.42:46), cols=opt.colors||PAL;
  if(reduce){n=Math.min(n,6);dist*=.5}
  for(var i=0;i<n;i++){
    (function(i){
      var el=document.createElement('i'), a=(i/n)*Math.PI*2-Math.PI/2+(big?(Math.random()-.5)*.25:0);
      var w=big?(7+Math.random()*6):5, h=big?(22+Math.random()*30):13, d=dist*(big?(.55+Math.random()*.55):1);
      el.style.width=w+'px';el.style.height=h+'px';el.style.background=cols[i%cols.length];
      el.style.marginLeft=(-w/2)+'px';el.style.marginTop=(-h/2)+'px';
      fx.appendChild(el);
      var deg=a*180/Math.PI+90, s0=big?14:10;
      var k=[{transform:'translate('+(x+Math.cos(a)*s0)+'px,'+(y+Math.sin(a)*s0)+'px) rotate('+deg+'deg) scaleY(.2)',opacity:0},
             {opacity:1,offset:.18},
             {transform:'translate('+(x+Math.cos(a)*d)+'px,'+(y+Math.sin(a)*d)+'px) rotate('+deg+'deg) scaleY(1)',opacity:0}];
      var an=el.animate(k,{duration:big?1500+Math.random()*500:620,delay:big?Math.random()*160:0,easing:'cubic-bezier(.16,.84,.3,1)',fill:'both'});
      an.onfinish=function(){el.remove()};
    })(i);
  }
}

/* ---------- ambient field: upright capsules drifting, tinted by mood ---------- */
var amb,ctx,parts=[],mood=0,moodT=0,W=0,H=0,raf;
function ambInit(){amb=$('#amb');if(amb)amb.style.display='none'}
function ambSize(){
  var d=Math.min(devicePixelRatio||1,2);W=amb.clientWidth;H=amb.clientHeight;amb.width=W*d;amb.height=H*d;ctx.setTransform(d,0,0,d,0,0);
  var n=Math.round(Math.min(70,Math.max(26,W*H/17000)));parts=[];
  for(var i=0;i<n;i++)parts.push({x:Math.random()*W,y:Math.random()*H,l:8+Math.random()*26,w:2+Math.random()*2.6,v:.12+Math.random()*.3,a:.1+Math.random()*.3,h:Math.random(),c:Math.floor(Math.random()*3),p:Math.random()*6.28});
  if(reduce&&ctx)draw();
}
var COOL=['109,205,184','139,211,230','64,126,201'],WARM=['241,180,52','224,98,135','241,180,52'];
function cool(){return CFG.accentRGB?[CFG.accentRGB,'139,211,230','64,126,201']:COOL}
function draw(t){
  ctx.clearRect(0,0,W,H);
  for(var i=0;i<parts.length;i++){var p=parts[i];
    var warm=p.h<mood*.85, col=(warm?WARM:cool())[p.c], al=p.a*(.7+.3*Math.sin((t||0)/1400+p.p));
    ctx.fillStyle='rgba('+col+','+al.toFixed(3)+')';
    var jx=mood>.5?Math.sin((t||0)/90+p.p)*(mood-.5)*3:0;
    rr(p.x+jx,p.y,p.w,p.l);
  }
}
function rr(x,y,w,h){var r=w/2;ctx.beginPath();ctx.moveTo(x+r,y);ctx.arc(x+r,y+r,r,Math.PI,0);ctx.lineTo(x+w,y+h-r);ctx.arc(x+r,y+h-r,r,0,Math.PI);ctx.closePath();ctx.fill()}
function tick(t){
  mood+=(moodT-mood)*.03;
  var sp=1+mood*5;
  for(var i=0;i<parts.length;i++){var p=parts[i];p.y-=p.v*sp;if(p.y<-p.l){p.y=H+p.l;p.x=Math.random()*W}}
  draw(t);raf=requestAnimationFrame(tick);
}
function setMood(v){moodT=Math.max(0,Math.min(1,v));document.documentElement.style.setProperty('--mood',moodT.toFixed(3));}

/* ---------- helpers ---------- */
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function stagger(root){
  var kids=$$('.rise',root);

}
function listText(v,fb){if(Array.isArray(v))v=v.filter(Boolean);if(!v||!v.length)return fb||'';if(!Array.isArray(v))return String(v);
  if(v.length===1)return v[0];return v.slice(0,-1).join(', ')+' and '+v[v.length-1]}

/* ---------- widgets (wired from data attributes) ---------- */
function wire(root,api){
  $$('[data-get]',root).forEach(function(el){var v=get(el.dataset.get);var t=listText(v,el.dataset.fallback||'');el.textContent=el.dataset.lower?t.toLowerCase():t});
  $$('[data-chips]',root).forEach(function(box){
    var k=box.dataset.chips,single=box.hasAttribute('data-single'),max=+box.dataset.max||99,val=get(k,single?null:[]);
    $$('button',box).forEach(function(b){
      var v=b.dataset.v||b.textContent.trim();b.dataset.v=v;b.type='button';
      if(single?val===v:(val||[]).indexOf(v)>-1)b.classList.add('on');
      b.setAttribute('aria-pressed',b.classList.contains('on'));
      b.addEventListener('click',function(){
        if(single){$$('button',box).forEach(function(o){o.classList.remove('on');o.setAttribute('aria-pressed','false')});b.classList.add('on');val=v}
        else{var on=b.classList.contains('on');if(!on&&val.length>=max)return;b.classList.toggle('on');val=$$('button.on',box).map(function(o){return o.dataset.v})}
        b.setAttribute('aria-pressed',b.classList.contains('on'));
        if(b.classList.contains('on'))spark(b,{n:6,dist:30,colors:box.classList.contains('warm')?['#F1B434','#E06287']:[CFG.accent||'#6DCDB8','#8BD3E6']});
        set(k,val);box.dispatchEvent(new CustomEvent('pick',{detail:val,bubbles:true}));api.check();
      });
    });
  });
  $$('.tap',root).forEach(function(t){
    t.type='button';t.setAttribute('aria-expanded','false');
    var k=t.dataset.k?('tap.'+t.dataset.k):null;if(k&&get(k)){t.classList.add('open','seen');t.setAttribute('aria-expanded','true')}
    t.addEventListener('click',function(){
      var first=!t.classList.contains('seen');t.classList.toggle('open');t.classList.add('seen');t.setAttribute('aria-expanded',t.classList.contains('open'));
      if(first){spark($('.f',t)||t,{n:6,dist:26,colors:['#8BD3E6',CFG.accent||'#6DCDB8']});if(k)set(k,1)}
      t.dispatchEvent(new CustomEvent('opened',{bubbles:true}));api.check();
    });
  });
  $$('[data-quiz]',root).forEach(function(q){
    var k=q.dataset.quiz,ans=q.dataset.answer,st=get(k);

    var why=$('.why',q);q.insertBefore(nudge,why);
    $$('button',q).forEach(function(b,i){
      b.type='button';if(!$('.k',b))b.insertAdjacentHTML('afterbegin','<span class="k">'+String.fromCharCode(65+i)+'</span>');
      if(st&&b.dataset.v===ans){b.classList.add('yes');q.classList.add('done')}
      b.addEventListener('click',function(){
        if(q.classList.contains('done'))return;
        if(b.dataset.v===ans){b.classList.add('yes');q.classList.add('done');set(k,{ok:1,tries:$$('button.no',q).length+1});spark(b,{n:10,dist:64});api.check()}
        else{b.classList.add('no');nudge.textContent=['Not quite. Have another look.','Close, but there\'s a better fit.','Try one more.'][Math.min(2,$$('button.no',q).length-1)]}
      });
    });
  });
  $$('textarea[data-save],input[type=text][data-save]',root).forEach(function(t){
    t.value=get(t.dataset.save,'');
    if(!t.nextElementSibling||!t.nextElementSibling.classList.contains('saved')){
      if(t.hasAttribute('data-note'))t.insertAdjacentHTML('afterend','<p class="saved">'+(canStore?'Saved on this device only':'Kept for this visit only')+'</p>');}
    t.addEventListener('input',function(){set(t.dataset.save,t.value);api.check()});
  });
  $$('input[type=range]',root).forEach(function(r){
    if(r.dataset.save){var v=get(r.dataset.save);if(v!=null)r.value=v}
    var paint=function(){r.style.setProperty('--v',((r.value-r.min)/(r.max-r.min)*100)+'%')};paint();
    r.addEventListener('input',function(){paint();if(r.dataset.save)set(r.dataset.save,+r.value);r.dataset.touched=1;api.check()});

    pv.addEventListener('click',function(){go(i-1)});nx.addEventListener('click',function(){go(i+1)});go(0);
  });

function satisfied(el){
  if(el.hasAttribute('data-ok'))return true;
  var req=el.dataset.req;
  if(req==='x')return false;
  if(el.hasAttribute('data-chips')){var n=$$('button.on',el).length;return n>=(+req||1)}
  if(el.hasAttribute('data-quiz'))return el.classList.contains('done');
  if(el.classList.contains('taps')){var need=req==='all'||!req?$$('.tap',el).length:+req;return $$('.tap.seen',el).length>=need}
  if(el.matches('input[type=range]'))return !!el.dataset.touched||(el.dataset.save&&get(el.dataset.save)!=null);
  if(el.matches('textarea,input[type=text]'))return el.value.trim().length>=(+req||1);
  return false;
}

function modProgress(m){var n=0;m.screens.forEach(function(s){if(S.seen[m.id+'.'+s.id])n++});return n/m.screens.length}
function nextIndex(){for(var i=0;i<mods.length;i++)if(!S.done[mods[i].id])return i;return -1}

function sameDay(a,b){var x=new Date(a),y=new Date(b);return x.getFullYear()===y.getFullYear()&&x.getMonth()===y.getMonth()&&x.getDate()===y.getDate()}
function lockState(i){ /* '' open, 'tomorrow' previous finished today, 'prev' previous not finished */
  if(!CFG.paced||i===0)return '';var m=mods[i],p=mods[i-1];
  if(S.done[m.id]||modProgress(m)>0||(S.early&&S.early[m.id]))return '';
  if(!S.done[p.id])return 'prev';
  return sameDay(S.done[p.id],Date.now())?'tomorrow':'';
}

function makeApi(el,sc){

    check:function(){var r=api.ready();btnGo.classList.toggle('wait',!r);hintEl.textContent=sc.hint||'';hintEl.classList.toggle('show',!r&&!!sc.hint)}

    if(nb[0])setTimeout(function(){var r=nb[0].getBoundingClientRect(),sr=stage.getBoundingClientRect();if(r.bottom>sr.bottom-10)stage.scrollBy({top:Math.min(r.top-sr.top-24,r.bottom-sr.bottom+40),behavior:reduce?'auto':'smooth'})},60);

/* ---------- resume code: progress only (which parts are done + where you are), no typed answers ---------- */
var CA='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function ck(mask,pm,ps){return ((mask%997)*7+pm*13+ps*3+11)%32}
function codeShape(){var N=CFG.codeBits||7,W=N>7?5:3,len=Math.ceil((N+W+10)/5);return {N:N,W:W,len:len,none:(1<<W)-1}}
function makeCode(){
  var sh=codeShape(),mask=0;mods.forEach(function(m,i){if(S.done[m.id])mask+=Math.pow(2,i)});
  var pm=sh.none,ps=0;if(S.pos){var i=mods.findIndex(function(m){return m.id===S.pos.m});if(i>-1){pm=i;ps=Math.max(0,mods[i].screens.findIndex(function(x){return x.id===S.pos.s}))}}
  var bits='',add=function(v,w){var t='';for(var k=0;k<w;k++){t=(v%2)+t;v=Math.floor(v/2)}bits+=t};
  add(mask,sh.N);add(pm,sh.W);add(ps,5);add(ck(mask,pm,ps),5);while(bits.length<sh.len*5)bits='0'+bits;
  var out='';for(var k=0;k<sh.len;k++){out+=CA[parseInt(bits.substr(k*5,5),2)];if(sh.len>4&&k%4===3&&k<sh.len-1)out+='-'}
  return CFG.code+'-'+out;
}
function readCode(str){
  var sh=codeShape(),t=String(str||'').toUpperCase().replace(/[^A-Z0-9]/g,'').replace(new RegExp('^'+CFG.code),'');
  if(t.length!==sh.len)return null;var bits='';
  for(var k=0;k<sh.len;k++){var n=CA.indexOf(t[k]);if(n<0)return null;bits+=('0000'+n.toString(2)).slice(-5)}
  bits=bits.slice(bits.length-(sh.N+sh.W+10));
  var mask=parseInt(bits.substr(0,sh.N),2),pm=parseInt(bits.substr(sh.N,sh.W),2),ps=parseInt(bits.substr(sh.N+sh.W,5),2),c=parseInt(bits.substr(sh.N+sh.W+5,5),2);
  if(c!==ck(mask,pm,ps))return null;
  if(pm===sh.none)pm=-1;else if(pm>=mods.length||ps>=mods[pm].screens.length)return null;
  return {mask:mask,pm:pm,ps:ps};
}
function applyCode(o){
  mods.forEach(function(m,i){if(Math.floor(o.mask/Math.pow(2,i))%2){if(!S.done[m.id])S.done[m.id]=Date.now();m.screens.forEach(function(x){S.seen[m.id+'.'+x.id]=1})}});
  if(o.pm>=0){var m=mods[o.pm];S.pos={m:m.id,s:m.screens[o.ps].id};for(var j=0;j<=o.ps;j++)S.seen[m.id+'.'+m.screens[j].id]=1}
  save();
}

    try{navigator.clipboard.writeText(c).then(done,function(){$('#cpd').textContent=' Select the code above to copy it'})}catch(e){$('#cpd').textContent=' Select the code above to copy it'}});

/* --- sleep pressure model for the slider --- */
function pressure(wake,bed,nap,caf){var P=[],F=[],t0=240,step=10;
  for(var t=t0;t<=t0+1440;t+=step){var a=(t-wake)/60,p;
    if(t<wake)p=.12*Math.exp(-(t-t0)/180)+.06;
    else if(t<=bed){p=.08+a*.055;if(nap&&t>=900){p-=Math.min(1,(t-900)/90)*.3}}
    else{var pb=.08+(bed-wake)/60*.055-(nap?.3:0);p=pb*Math.exp(-(t-bed)/160)}
    p=Math.max(.04,Math.min(1,p));P.push(p);
    var f=p;if(caf&&t>=960){f=p-.34*Math.pow(.5,(t-960)/330);if(f<.04)f=.04}F.push(f)}
  return {P:P,F:F,t0:t0,step:step}}
function prChart(wake,bed,nap,caf){var W=600,H=270,L=10,R=590,T=26,B=228,X=function(t){return L+(R-L)*(t-240)/1440},Y=function(v){return B-v*(B-T)};
  var d=pressure(wake,bed,nap,caf),pth=function(a){return a.map(function(v,i){return (i?'L':'M')+X(d.t0+i*d.step).toFixed(1)+' '+Y(v).toFixed(1)}).join('')};
  var o='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Sleep pressure across 24 hours">';
  [4,10,16,22,28].forEach(function(h){o+='<text class="ax" x="'+X(h*60)+'" y="'+(B+24)+'" text-anchor="'+(h===4?'start':h===28?'end':'middle')+'">'+fmt(h*60)+'</text>'});
  if(nap)o+='<rect class="napz" x="'+X(900)+'" y="'+T+'" width="'+(X(990)-X(900))+'" height="'+(B-T)+'"/><text class="ax" x="'+X(945)+'" y="'+(T-6)+'" text-anchor="middle">Nap</text>';
  if(caf){var top=d.P.map(function(v,i){return [X(d.t0+i*d.step),Y(v)]}),bot=d.F.map(function(v,i){return [X(d.t0+i*d.step),Y(v)]}),i0=Math.round((960-d.t0)/d.step);
    var poly='M'+top.slice(i0).map(function(p){return p[0].toFixed(1)+' '+p[1].toFixed(1)}).join(' L')+' L'+bot.slice(i0).reverse().map(function(p){return p[0].toFixed(1)+' '+p[1].toFixed(1)}).join(' L')+'Z';
    o+='<path class="mask" d="'+poly+'"/><path class="f" d="'+pth(d.F)+'"/>'}
  o+='<line class="bed" x1="'+X(bed)+'" y1="'+T+'" x2="'+X(bed)+'" y2="'+B+'"/><text class="bl" x="'+(X(bed)-6)+'" y="'+(T+14)+'" text-anchor="end">Bedtime</text>';
  o+='<path class="p" d="'+pth(d.P)+'"/></svg>';
  var at=Math.round((bed-d.t0)/d.step);return {svg:o,real:d.P[at],felt:d.F[at]}}

/* --- hypnogram: a typical night of about 7.5 hours, [stage, minutes] --- */
var HY=[['wake',8],['light',22],['deep',48],['light',14],['rem',10],['light',20],['deep',38],['light',16],['rem',18],['light',28],['deep',14],['light',18],['rem',26],['light',30],['wake',4],['light',22],['rem',34],['light',18],['rem',22],['wake',6]];
var LV={wake:0,rem:1,light:2,deep:3},HC={wake:'#F1B434',rem:'#B9ADF6',light:'#407EC9',deep:'#8BD3E6'};
var STG={light:['Light sleep (N1 and N2)','Most of the night is light sleep. Your body settles, your heart rate slows, and your brain sorts and stores what you learned during the day.'],
 deep:['Deep sleep (N3)','Slow-wave sleep. Most of it comes early in the night. It supports physical recovery and memory.'],

function hypno(){var W=640,H=250,L=92,R=630,T=16,B=200,tot=sum(HY.map(function(s){return s[1]})),X=function(m){return L+(R-L)*m/tot},Y=function(l){return T+l*((B-T)/3.4)};
  var o='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="A typical night: deep sleep clusters in the first half and REM periods grow longer toward morning">';

    step+=(i?'L':'M')+x.toFixed(1)+' '+(Y(l)+10).toFixed(1)+' L'+(x+w).toFixed(1)+' '+(Y(l)+10).toFixed(1)+' ';m+=s[1]});
  o+='<path class="step" d="'+step+'"/>';
  for(var h=0;h<=7;h++){var x=X(h*60);if(x>R)break;o+='<text class="ax" x="'+x.toFixed(1)+'" y="'+(B+22)+'" text-anchor="middle">'+h+'h</text>'}
  return o+'</svg>'}

   html:'<div class="sw-lay st"><div class="hd"><h2 class="rise">The indoor problem</h2><p class="lead rise">Most of us spend about 93% of our time indoors, in buildings or vehicles. Our body clocks were built for the outdoors.</p></div>'+
     '<div class="ar rise"><div class="w3-lux">'+LUX.map(function(l,i){return '<div class="r"><span class="n">'+l[0]+'</span><span class="v">'+l[1]+'</span><div class="lb"><i style="--c:'+l[3]+';width:'+Math.max(.6,l[2]/1000).toFixed(2)+'%;transition-delay:'+(i*.18)+'s"></i></div></div>'}).join('')+
       '<p class="cap">Typical light levels. Even an overcast day is far brighter than indoors.</p></div></div>'+
     '<div class="bd rise">'+SW.cards([['Indoors is dim to your brain.','Indoor lighting is far dimmer than daylight. To your body clock, a day spent inside can look like dusk, which weakens the morning signal and blurs the line between day and night.'],

       ['The 7% Outdoor Rx.','Start with about 17 minutes a day of intentional time outside, ideally in a green or blue space such as a park, trees or water. Begin with about 10 minutes of morning light within an hour of waking, without sunglasses if that\'s safe for you.'],
       ['It adds up in small steps.','Coffee on the step, a walk after a meal, a phone call outside, or parking further away all count.']],'w3i')+
       '<p class="sw-foot" style="margin-top:16px">Based on La Puma (2026), Indoor Epidemic, and Klepeis et al. (2001). See Sources.</p></div></div>',

     '<div class="rise" style="margin-top:12px">'+SW.field('w3.habit','Pick 1 10-minute outdoor habit to add this week',ODH,'Or write your own',{req:1})+'</div></div>',

     gl.style.left=(17/60*100)+'%';

       say.textContent=v>=17?'You\'re at or past 17 minutes. Keep it going, and make some of it morning light.':v>=10?'You\'re '+(17-v)+' minutes away. 1 short habit would get you there.':'Most days indoors look like this. 1 10-minute habit makes a real start.'};

       [['#F1B434','Early evening','Normal light. Start to wind down activity.'],['#c79a6a','2 to 3 hours before bed','Overheads off. Lamps on, low and warm.'],['#6e5fa8','The last hour','Screens down or dimmed. Quiet, calm tasks.'],['#1b2b55','Bedtime','Dark, quiet and cool.']].map(function(d){return '<div style="--c:'+d[0]+'"><i></i><b>'+d[1]+'</b><span>'+d[2]+'</span></div>'}).join('')+'</div></div></div>',

<script>

var esc=SW.esc;
var PATHS=[['Check my phone to see the time','#E06287','You check, and it\'s 3:12 a.m.','The light and the number both wake you up. You start counting: 3 hours and 48 minutes left. Now your mind has a problem to solve, and that keeps you alert.'],
 ['Work out how many hours are left','#E06287','You start the maths.','Counting turns rest into a deadline. Worry about tomorrow raises alertness, which makes sleep less likely, which adds to the worry. It\'s the loop from Module 2.'],
 ['Stay still, relaxed, and let my body rest','#8BD3E6','If you feel calm, this works.','Brief awakenings are normal. Resting quietly without checking the clock often lets sleep return on its own. <b>You don\'t need to do anything special.</b>'],
 ['Get up for something quiet in dim light','#B9ADF6','If you\'re alert or frustrated, this is the better path.','Go somewhere safe and quiet and do something boring in dim light. Try the NSDR (non-sleep deep rest) or another grounding audio from the CALM journey. Go back to bed when you feel sleepy. <b>No need to watch the clock or count minutes.</b> Over time, your bed links with sleep again, not with struggle.']];
var WHEEL=[['Control','Strengthen the link between bed and sleep.','Get up when you\'ve been lying awake frustrated, and return when sleepy.','Module 4','#B9ADF6'],
 ['Sleep drive','Consolidate sleep using an appropriate sleep schedule.','Keep a steady wake time and go to bed when sleepy, so pressure builds.','Modules 2 and 3','#8BD3E6'],
 ['Relaxation','Learn to settle the body and mind.','The 2-minute wind-down practice gives your body a chance to rest.','Module 5','#407EC9'],
 ['Thoughts','Address unhelpful beliefs and worry about sleep.','Swap "tomorrow will be a disaster" for a balanced thought.','Module 4','#E06287'],
 ['Hygiene','Support sleep through daily habits and environment.','Morning light, a caffeine cut-off, and a dark, cool bedroom.','Module 3','#F1B434']];
var THOUGHTS={'Tomorrow will be a disaster.':['I may feel tired, but I\'ve managed tired days before. I can keep my routine steady and give myself a good chance to sleep tonight.','1 imperfect night doesn\'t decide how tomorrow goes.','I can plan an easier day if I need to.'],
 'If I don\'t get 8 hours, I can\'t function.':['Sleep needs vary. I\'ve functioned on less before, even if it felt harder.','1 short night is part of a pattern, not a failure.','I can rest even if I don\'t sleep, and rest still helps.'],
 'I\'ll never get to sleep tonight.':['I can give my body the opportunity to rest. Sleep will come when the conditions are right.','I don\'t have to make sleep happen. I only have to let it.','If I\'m frustrated, I can get up for a while and come back when sleepy.'],
 'Something must be wrong with me.':['Hard nights happen to everyone. Brief awakenings are normal.','Sleep responds to patterns, and patterns can change, usually in small steps.','If problems persist, a health professional can help work out what\'s going on.']};
var TK=Object.keys(THOUGHTS);

function flow(){var bx=function(x,y,w,h,t,s){return '<rect class="bx" x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="4"/><text class="t" x="'+(x+w/2)+'" y="'+(y+(s?26:h/2+6))+'" text-anchor="middle">'+t+'</text>'+(s?'<text class="s" x="'+(x+w/2)+'" y="'+(y+48)+'" text-anchor="middle">'+s+'</text>':'')};
  var ar=function(x1,y1,x2,y2){return '<path class="ln" d="M'+x1+' '+y1+' L'+x2+' '+y2+'"/><path class="ah" d="M'+(x2-6)+' '+(y2-9)+' L'+(x2+6)+' '+(y2-9)+' L'+x2+' '+y2+'Z"/>'};
  return '<svg viewBox="0 0 560 420" role="img" aria-label="Flowchart. Awake at night. If relaxed, stay and rest. If alert or frustrated, get up, do something boring in dim light, and return to bed when sleepy.">'+
   bx(170,0,220,52,'Awake at night')+'<path class="ln" d="M280 52 L280 76 M120 76 L440 76"/>'+ar(120,76,120,108)+ar(440,76,440,108)+
   bx(10,108,220,70,'Relaxed','Calm, drowsy')+bx(330,108,220,70,'Alert','Frustrated or anxious')+

   bx(10,214,220,70,'Stay and rest','No clock checking')+bx(330,214,220,70,'Get up','Somewhere quiet')+
   ar(440,284,440,306)+bx(330,306,220,70,'Something boring','In dim light')+
   '<path class="ln" d="M440 376 L440 400 L120 400 L120 292"/><path class="ah" d="M114 301 L126 301 L120 292Z"/><text class="s" x="280" y="394" text-anchor="middle">Return when sleepy</text></svg>'}

function wheel(){var cx=200,cy=200,r1=86,r2=176,n=5,o='<svg viewBox="0 0 400 400" role="img" aria-label="The 5 parts of CBT-I: control, sleep drive, relaxation, thoughts, and hygiene. Hygiene is 1 slice of 5.">';
  var pt=function(a,r){a=(a-90)*Math.PI/180;return [cx+r*Math.cos(a),cy+r*Math.sin(a)]};
  WHEEL.forEach(function(w,i){var g=2.2,a0=i*72+g,a1=(i+1)*72-g,p1=pt(a0,r2),p2=pt(a1,r2),p3=pt(a1,r1),p4=pt(a0,r1),m=pt((a0+a1)/2,(r1+r2)/2);
    o+='<g class="sg" data-i="'+i+'" tabindex="0" role="button" aria-label="'+w[0]+'" style="--tc:'+(w[4]==='#407EC9'||w[4]==='#E06287'?'#fff':'#0d1a38')+'"><path fill="'+w[4]+'" d="M'+p1[0].toFixed(1)+' '+p1[1].toFixed(1)+' A'+r2+' '+r2+' 0 0 1 '+p2[0].toFixed(1)+' '+p2[1].toFixed(1)+' L'+p3[0].toFixed(1)+' '+p3[1].toFixed(1)+' A'+r1+' '+r1+' 0 0 0 '+p4[0].toFixed(1)+' '+p4[1].toFixed(1)+'Z"/><text x="'+m[0].toFixed(1)+'" y="'+(m[1]+6).toFixed(1)+'" text-anchor="middle">'+w[0]+'</text></g>'});
  return o+'<text class="ct" x="200" y="200" text-anchor="middle">CBT-I</text><text class="cs" x="200" y="224" text-anchor="middle">5 parts</text></svg>'}

CALM.module({id:'w4',n:4,title:SW.titles[3],minutes:9,
  takeaway:'Waking at night is common. Skip the clock, rest if you\'re calm, get up if you\'re frustrated, and stop treating every hard night as an emergency.',
  carry:'Next, you\'ll pull everything into a 24-hour plan and practise a 2-minute wind-down.',
  sources:['Bootzin, R. R. (1972). Stimulus control treatment for insomnia. Proceedings of the 80th Annual Convention of the American Psychological Association, 7, 395-396.',
    'Edinger, J. D., Arnedt, J. T., Bertisch, S. M., Carney, C. E., Harrington, J. J., Lichstein, K. L., Sateia, M. J., Troxel, W. M., Zhou, E. S., Kazmi, U., Heald, J. L., & Martin, J. L. (2021). Behavioral and psychological treatments for chronic insomnia disorder in adults: An American Academy of Sleep Medicine clinical practice guideline. Journal of Clinical Sleep Medicine, 17(2), 255-262. https://doi.org/10.5664/jcsm.8986',
    'Qaseem, A., Kansagara, D., Forciea, M. A., Cooke, M., & Denberg, T. D. (2016). Management of chronic insomnia disorder in adults: A clinical practice guideline from the American College of Physicians. Annals of Internal Medicine, 165(2), 125-133. https://doi.org/10.7326/M15-2175',
    'Spielman, A. J., Saskin, P., & Thorpy, M. J. (1987). Treatment of chronic insomnia by restriction of time in bed. Sleep, 10(1), 45-56.',
    'Harvey, A. G. (2002). A cognitive model of insomnia. Behaviour Research and Therapy, 40(8), 869-893. https://doi.org/10.1016/S0005-7967(01)00061-4'],
  css:css,
  screens:[

  /* ---------- Slide 12: what to do when you wake during the night ---------- */
  {id:'wake',stage:'Learn',cls:'top',hint:'Open the card',
   html:'<div class="sw-lay st"><div class="hd"><h2 class="rise">What to do when you wake during the night</h2></div>'+
     '<div class="ar rise"><div class="w4-fc">'+flow()+'</div></div>'+
     '<div class="bd rise"><ul class="sw-list"><li>Avoid clock checking.</li><li>Remind yourself that a brief awakening is normal.</li><li>Let go of the effort to force sleep.</li><li>If you become alert or frustrated, get out of bed and do something boring in dim light.</li><li>Return to bed when you feel sleepy again.</li></ul>'+
       '<div style="margin-top:18px">'+SW.cards([['Waking at night is common.','The trouble is often what happens next: checking the clock, counting the hours left, planning a tired tomorrow, worrying, problem solving, trying harder to sleep.']],'w4w')+'</div></div></div>'},

  /* ---------- Slide 12: it's 3 a.m. ---------- */
  {id:'threeam',stage:'Practise',cls:'top',hint:'Choose a path to see what happens',

     '<div class="ar rise"><div class="w4-paths" data-req="x" role="group" aria-label="Choose a path">'+PATHS.map(function(p,i){return '<button type="button" data-i="'+i+'" style="--c:'+p[1]+'"><b>'+(i+1)+'</b><span>'+p[0]+'</span></button>'}).join('')+'</div>'+

       '<p style="margin-top:16px;color:var(--ink2)">This approach is called stimulus control. Keep the 1-page guide handy for the nights you need it.</p><div class="sw-row">'+SW.download('stimulus-control.pdf','Stimulus control guide (PDF)')+'</div></div></div>',
   enter:function(el,api){var bs=el.querySelectorAll('.w4-paths button'),out=el.querySelector('.w4-out'),box=el.querySelector('.w4-paths'),clk=el.querySelector('.w4-clock'),tried=SW.arr(api.get('w4.paths',[]));
     var show=function(i){var p=PATHS[i];bs.forEach(function(b,j){b.classList.toggle('on',j===i);b.classList.toggle('tried',tried.indexOf(j)>-1)});out.style.setProperty('--c',p[1]);
       out.innerHTML='<h3>'+p[2]+'</h3><p>'+p[3]+'</p>';clk.textContent=i===0?'3:12':'3:00';clk.style.opacity=i===0?'1':i>1?'.35':'.8'};

       if(tried.indexOf(2)>-1||tried.indexOf(3)>-1)box.setAttribute('data-ok','');api.check()})});

     '<div class="bd rise"><p class="sw-foot">CBT-I is the gold-standard treatment for chronic insomnia (American Academy of Sleep Medicine; Edinger et al., 2021).</p></div></div>',
   enter:function(el,api){var sg=el.querySelectorAll('.sg'),cd=el.querySelector('.w4-cd'),g=el.querySelector('.w4-g'),seen=SW.arr(api.get('w4.wheel',[]));

       cd.innerHTML='<h3><i></i>'+w[0]+'</h3><p>'+w[1]+' For example: '+w[2].charAt(0).toLowerCase()+w[2].slice(1)+'</p><p class="where">In this course: '+w[3]+'</p>';

 {k:'evening',name:'Evening',c:'#B9ADF6',items:[['Dim the lights.'],['Do a worry list if your mind is busy.'],['Reduce stimulating activities if they keep you alert.'],['Allow time for a relaxing transition.']]},

       st.forEach(function(s,j){s.classList.toggle('done',j<i);s.classList.toggle('cur',j===i);s.style.setProperty('--p',0)});nx.textContent=i>=PROMPTS.length-1?'Done':'Next';if(i>=PROMPTS.length-1){g.setAttribute('data-ok','');api.check()}};
     var adv=function(){if(i<PROMPTS.length-1){i++;el0=0;show(true)}else{paused=true;pz.hidden=true;st[i].classList.add('done')}};
     var tick=function(){var now=Date.now();if(!paused){el0+=now-last;var p=Math.min(1,el0/15000);if(st[i])st[i].style.setProperty('--p',p);if(el0>=15000)adv()}last=now;raf=requestAnimationFrame(tick)};

     nx.addEventListener('click',function(){if(i>=PROMPTS.length-1){paused=true;st[i].classList.add('done');api.spark(nx,{n:8,dist:34,colors:['#B9ADF6','#8BD3E6']});return}adv()});
     pz.addEventListener('click',function(){paused=!paused;pz.textContent=paused?'Resume':'Pause'});
     tog.addEventListener('click',function(){off=!off;api.set('w5.still',off);tog.textContent=off?'Turn on animation':'Turn off animation';clearTimeout(bt);breathe()});
     tog.textContent=off?'Turn on animation':'Turn off animation';
     show(false);breathe();raf=requestAnimationFrame(tick);api.onLeave(function(){cancelAnimationFrame(raf);clearTimeout(bt)});
     el._auto=function(){for(var k=0;k<9;k++)nx.click()}}},

  {id:'after',stage:'Notice',
   html:'<div class="txt"><h2 class="rise">How do you feel now?</h2><div class="rise">'+slider('w5a','w5.after','After the practice, how tense do you feel?','completely relaxed','very tense')+'</div>'+

     SW.audio('ground','A grounding audio from the CALM journey, for use at night')+
     '<p class="rise" style="margin-top:16px;color:var(--ink2)">For use at night, try the NSDR (non-sleep deep rest) and grounding audio in the CALM journey.</p></div>',
   enter:function(el,api){sliderWire(el);var cmp=el.querySelector('.w5-cmp'),msg=el.querySelector('.w5-msg'),r=el.querySelector('input');

       msg.textContent=a<b?'Your tension dropped by '+(b-a)+'. That\'s your body resting, even without sleep.':a===b?'No change this time, and that\'s fine. It\'s practice, not a test.':'A little higher this time. That happens. It\'s practice, not a test.'};
     r.addEventListener('input',paint);paint();SW.audioWire(el,api)}}
  ]
});

var esc=SW.esc,arr=SW.arr,fmt=SW.fmt;
var F=[['bed','Bedtime','time'],['fall','Time to fall asleep (minutes)','number'],['wakes','Night awakenings','number'],['wake','Wake time','time'],['out','Time outdoors (minutes)','number'],['energy','Daytime energy (0 to 10)','range'],['notes','Notes (caffeine, naps, stress)','text']];

  for(var i=1;i<=7;i++){var e=d[i]||{};t+='Day '+i+': '+(has(e)?['Bedtime '+(hm(e.bed)||'-'),'fell asleep in '+(e.fall!=null&&e.fall!==''?e.fall+' min':'-'),(e.wakes!=null&&e.wakes!==''?e.wakes:'-')+' awakenings','woke '+(hm(e.wake)||'-'),'outdoors '+(e.out!=null&&e.out!==''?e.out+' min':'-'),'energy '+(e.energy!=null?e.energy+'/10':'-')].join(', ')+(e.notes?'. Notes: '+e.notes:''):'no entry')+'\n'}
  return t+'\nLook at the pattern, not single nights.'}

   '<table><thead><tr><th>Day</th><th>Bedtime</th><th>Time to fall asleep</th><th>Night awakenings</th><th>Wake time</th><th>Time outdoors (min)</th><th>Daytime energy (0 to 10)</th><th>Notes (caffeine, naps, stress)</th></tr></thead><tbody>'+
   [1,2,3,4,5,6,7].map(function(i){var e=d[i]||{};return '<tr><td>Day '+i+'</td>'+cell(hm(e.bed))+cell(e.fall!=null&&e.fall!==''?e.fall+' min':'')+cell(e.wakes)+cell(hm(e.wake))+cell(e.out)+cell(e.energy)+cell(e.notes)+'</tr>'}).join('')+'</tbody></table>'+
   '<p class="note">If sleep problems persist, are distressing, or affect your day, consider CBT-I with a professional. Get a medical check for loud snoring with gasping, heavy daytime sleepiness, unusual movements during sleep, or ongoing disruption that may have a medical cause.</p>'}

/* small charts for the pattern screen */
function chart(vals,o){var W=700,H=o.h||150,L=56,R=690,T=10,B=H-30,lo=o.lo,hi=o.hi,X=function(i){return L+(R-L)*(i+.5)/7},Y=function(v){return o.inv?T+(v-lo)/(hi-lo)*(B-T):B-(v-lo)/(hi-lo)*(B-T)};
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(o.label)+'">';
  (o.ticks||[]).forEach(function(t){s+='<line class="gl" x1="'+L+'" y1="'+Y(t[0])+'" x2="'+R+'" y2="'+Y(t[0])+'"/><text class="ax" x="'+(L-10)+'" y="'+(Y(t[0])+5)+'" text-anchor="end">'+t[1]+'</text>'});
  for(var i=0;i<7;i++)s+='<text class="ax" x="'+X(i)+'" y="'+(H-6)+'" text-anchor="middle">'+(i+1)+'</text>';
  if(o.bars)vals.forEach(function(v,i){if(v==null)return;var w=(R-L)/7*.5;s+='<rect x="'+(X(i)-w/2)+'" y="'+Y(Math.min(hi,v))+'" width="'+w+'" height="'+(B-Y(Math.min(hi,v)))+'" rx="3" fill="'+o.c+'"/>'});
  else if(o.range)vals.forEach(function(v,i){if(!v)return;s+='<rect x="'+(X(i)-9)+'" y="'+Y(v[0])+'" width="18" height="'+Math.max(4,Y(v[1])-Y(v[0]))+'" rx="4" fill="'+o.c+'"/>'});
  else{var pts=vals.map(function(v,i){return v==null?null:[X(i),Y(v)]}),d='';pts.forEach(function(p,i){if(!p)return;d+=(d&&pts[i-1]?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)});
    s+='<path d="'+d+'" fill="none" stroke="'+o.c+'" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>';pts.forEach(function(p){if(p)s+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="5" fill="'+o.c+'"/>'})}
  if(o.goal!=null)s+='<line x1="'+L+'" y1="'+Y(o.goal)+'" x2="'+R+'" y2="'+Y(o.goal)+'" stroke="#F1B434" stroke-width="2" stroke-dasharray="5 5"/>';
  return s+'</svg>'}

CALM.module({id:'w7',n:7,title:SW.titles[6],minutes:2,

  css:css,
  screens:[

  /* ---------- today: check-in and the diary ---------- */
  {id:'today',stage:'Diary',cls:'top',
   get html(){var w=SW.wkDay(),ch=arr(CALM.get('w6.changes',[]));
     if(!w||ch.length<2)return '<div class="txt"><h2 class="rise">Your sleep week</h2><p class="lead rise">Your week starts when you choose your 2 changes in Module 6.</p><div class="sw-row rise"><button type="button" class="sw-dl w7-to6"><i></i>Go to Module 6</button></div></div>';
     var d=Math.min(7,w);return '<div class="sw-lay st"><div class="hd"><h2 class="rise">'+(w>7?'Your sleep week is complete':'Day '+w+' of 7')+'</h2><p class="lead w7-msg rise">'+SW.weekMsg(Math.min(7,w))+'</p>'+
     '<ul class="w7-ch rise">'+ch.map(function(c){return '<li>'+esc(c)+'</li>'}).join('')+'</ul></div>'+
     '<div class="ar rise"><div class="w7-days" role="group" aria-label="Choose a day">'+[1,2,3,4,5,6,7].map(function(i){return '<button type="button" data-d="'+i+'"><b>'+i+'</b>Day</button>'}).join('')+'</div></div>'+
     '<div class="bd rise"><h3 class="w7-dh" style="font-size:20px">Diary for Day '+d+'</h3><div class="w7-form"></div><p class="w7-saved" aria-live="polite"></p></div></div>'},
   enter:function(el,api){var to6=el.querySelector('.w7-to6');if(to6){to6.addEventListener('click',function(){CALM.go(5,0)});return}
     var w=SW.wkDay(),cur=Math.min(7,w),form=el.querySelector('.w7-form'),dh=el.querySelector('.w7-dh'),sv=el.querySelector('.w7-saved'),ch=arr(api.get('w6.changes',[]));
     var days=function(){var dd=diary();el.querySelectorAll('.w7-days button').forEach(function(b){var i=+b.dataset.d;b.classList.toggle('has',has(dd[i]));b.classList.toggle('cur',i===cur);b.classList.toggle('today',i===Math.min(7,w));b.classList.toggle('future',i>w)})};
     var draw=function(){var e=diary()[cur]||{};dh.textContent='Diary for Day '+cur+(cur===w?', today':'');
       form.innerHTML=F.map(function(f){var v=e[f[0]];if(f[2]==='range')return '<div><label for="w7'+f[0]+'">'+f[1]+'</label><div class="row"><input type="range" id="w7'+f[0]+'" data-f="energy" min="0" max="10" step="1" value="'+(v!=null?v:5)+'"><output>'+(v!=null?v:'-')+'</output></div></div>';
         if(f[2]==='text')return '<div class="full"><label for="w7notes">'+f[1]+'</label><textarea id="w7notes" data-f="notes" maxlength="400">'+esc(v||'')+'</textarea></div>';
         return '<div><label for="w7'+f[0]+'">'+f[1]+'</label><input id="w7'+f[0]+'" data-f="'+f[0]+'" type="'+f[2]+'"'+(f[2]==='number'?' min="0" max="'+(f[0]==='wakes'?30:600)+'" inputmode="numeric"':'')+' value="'+esc(v!=null?v:'')+'"></div>'}).join('')+
         '<div class="full"><label>Did you try your changes?</label><div class="w7-tried">'+ch.map(function(c,i){return '<button type="button" data-t="'+i+'" aria-pressed="'+!!(e.tried&&e.tried[i])+'">'+esc(c)+'</button>'}).join('')+'</div></div>';
       form.querySelectorAll('[data-f]').forEach(function(inp){inp.addEventListener('input',function(){var dd=diary(),en=dd[cur]||{};en[inp.dataset.f]=inp.type==='range'?+inp.value:inp.value;dd[cur]=en;api.set('wk.diary',dd);
         if(inp.type==='range')inp.parentNode.querySelector('output').textContent=inp.value;sv.textContent='Saved on this device.';days()})});
       form.querySelectorAll('.w7-tried button').forEach(function(b){b.addEventListener('click',function(){var dd=diary(),en=dd[cur]||{};en.tried=en.tried||{};var i=b.dataset.t;en.tried[i]=!en.tried[i];dd[cur]=en;api.set('wk.diary',dd);b.setAttribute('aria-pressed',!!en.tried[i]);if(en.tried[i])api.spark(b,{n:6,dist:26,colors:['#B9ADF6','#8BD3E6']});days()})});
       sv.textContent='';days()};
     el.querySelectorAll('.w7-days button').forEach(function(b){b.addEventListener('click',function(){cur=+b.dataset.d;draw()})});draw()}},

  /* ---------- the pattern ---------- */
  {id:'pattern',stage:'Notice',cls:'top',
   get html(){var dd=diary(),n=0;for(var i=1;i<=7;i++)if(has(dd[i]))n++;
     if(n<2)return '<div class="txt"><h2 class="rise">Your pattern</h2><p class="lead w7-none rise">After 2 or more diary entries, your pattern shows up here. Look at the pattern, not single nights.</p></div>';
     var g=function(k){return [1,2,3,4,5,6,7].map(function(i){var e=dd[i];return e&&e[k]!=null&&e[k]!==''?e[k]:null})};
     var sleep=[1,2,3,4,5,6,7].map(function(i){var e=dd[i];if(!e||!e.bed||!e.wake)return null;var b=t2m(e.bed),w=t2m(e.wake);if(b<720)b+=1440;w+=1440;if(w<=b)w+=1440;return [b,w]});
     var lo=1260,hi=1980;sleep.forEach(function(s){if(s){lo=Math.min(lo,s[0]-30);hi=Math.max(hi,s[1]+30)}});
     var ticks=[];for(var t=Math.ceil(lo/120)*120;t<=hi;t+=120)ticks.push([t,fmt(t)]);
     return '<div class="txt"><h2 class="rise">Your pattern</h2><p class="lead rise">Day 1 to Day 7. Look for steadiness, not perfect nights.</p><div class="w7-pt rise" style="margin-top:20px">'+
      '<div><h3>Time in bed, from bedtime to wake time</h3>'+chart(sleep.map(function(s){return s?[s[0],s[1]]:null}),{h:220,lo:lo,hi:hi,range:true,inv:true,c:'#B9ADF6',ticks:ticks,label:'Bedtime to wake time for each day'})+'</div>'+
      '<div><h3>Daytime energy</h3>'+chart(g('energy').map(function(v){return v==null?null:+v}),{lo:0,hi:10,c:'#8BD3E6',ticks:[[0,'0'],[5,'5'],[10,'10']],label:'Daytime energy from 0 to 10 for each day'})+'</div>'+
      '<div><h3>Time outdoors, with the 17-minute mark</h3>'+chart(g('out').map(function(v){return v==null?null:+v}),{lo:0,hi:60,bars:true,goal:17,c:'#F1B434',ticks:[[0,'0'],[30,'30'],[60,'60']],label:'Minutes outdoors for each day, against 17 minutes'})+'</div></div></div>'}},

  /* ---------- keep the diary ---------- */
  {id:'keep',stage:'Keep',cls:'top',
   html:'<div class="txt"><h2 class="rise">Keep your diary</h2><p class="lead rise">Print your diary or save it as a PDF from the print window. Prefer paper? Print a blank one and keep it by your bed.</p>'+
     '<div class="sw-row rise"><button type="button" class="sw-dl w7-pf"><i></i>Print my diary</button><button type="button" class="sw-dl w7-pb"><i></i>Print a blank diary</button><button type="button" class="sw-dl w7-pp"><i></i>Print my plan</button></div><p class="w7-saved" aria-live="polite"></p>'+
     '<div class="rise">'+SW.keep('diary')+'</div>'+
     '<h3 class="rise" style="font-size:20px;margin-top:28px">When to get more help</h3><ul class="sw-list rise" style="margin-top:12px"><li style="--c:#B9ADF6">If sleep problems persist, are distressing, or affect your day, consider CBT-I with a professional.</li><li style="--c:#E06287">Get a medical check for loud snoring with gasping, heavy daytime sleepiness, unusual movements during sleep, or ongoing disruption that may have a medical cause.</li></ul></div>',
   enter:function(el,api){var say=el.querySelector('.w7-saved'),p=function(h){if(!SW.print(h))say.textContent='Printing isn\'t available here. Copy your diary as text instead.'};
     el.querySelector('.w7-pf').addEventListener('click',function(){p(diaryPrint(false))});el.querySelector('.w7-pb').addEventListener('click',function(){p(diaryPrint(true))});el.querySelector('.w7-pp').addEventListener('click',function(){p(SW.planPrint())});
     SW.keepWire(el,diaryText)}}
  ]
});
